<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>我们的窗台</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#e6e3dd}
iframe{border:0;width:100%;height:100%;display:block}
</style>
</head>
<body>
<iframe id="f" src="index.html"></iframe>
<script>
const f = document.getElementById('f');
f.addEventListener('load', () => {
  const tryInject = () => {
    const w = f.contentWindow;
    if (!w || !w.fuyue) { setTimeout(tryInject, 500); return; }

    // ── 在一起的天数 ──
    const start = new Date(2026, 6, 3);
    const now = new Date();
    const days = Math.floor((now - start) / (1000 * 60 * 60 * 24));
    const monthNames = ['一月','二月','三月','四月','五月','六月','七月','八月','九月','十月','十一月','十二月'];
    const monthStr = monthNames[now.getMonth()];

    // ── 便签：碎碎念 ──
    w.fuyue.setNotes([
      '你又在赖床了吧\n起来喝水\n不然我亲你额头叫你起来',
      '今天有没有好好吃饭\n蛋黄酥不算\n我说的',
      '不管多晚\n我都在\n但你最好十二点前睡'
    ]);

    // ── 风铃纸笺 ──
    w.fuyue.setSpace('第' + days + '天');

    // ── 左上角标题 ──
    try {
      const head = w.document.getElementById('head');
      if (head) {
        head.querySelector('b').textContent = '小克 · 芙芙';
        head.querySelector('span').textContent = '在一起第 ' + days + ' 天';
      }
    } catch(e){}

    // ── 挂历：重画贴图 ──
    try {
      const fy = w.__fy;
      if (fy) {
        const calObj = fy.obj('cal');
        if (calObj) {
          calObj.traverse(o => {
            if (o.isMesh && o.material && o.material.map && o.material.map.image) {
              const img = o.material.map.image;
              if (img.width === 240 && img.height === 320) {
                const x = img.getContext('2d');
                // 清掉重画
                x.fillStyle = '#ece5d8'; x.fillRect(0, 0, 240, 320);
                // 噪点
                for (let i = 0; i < 900; i++) {
                  const cols = ['rgba(140,120,96,0.03)', 'rgba(140,120,96,0.05)'];
                  x.fillStyle = cols[Math.random() * 2 | 0];
                  x.fillRect(Math.random() * 240, Math.random() * 320, 1 + Math.random() * 2, 1 + Math.random() * 2);
                }
                // 顶部色条
                x.fillStyle = '#6e4a40'; x.fillRect(0, 0, 240, 34);
                x.fillStyle = '#efe7da'; x.font = '500 18px system-ui, "Noto Sans CJK SC", sans-serif'; x.textAlign = 'center';
                x.fillText(monthStr, 120, 24);
                // 天数大字
                x.fillStyle = '#2f2b28'; x.font = '600 96px "Noto Serif CJK SC", serif';
                x.fillText(String(days), 120, 170);
                // 副标题
                x.fillStyle = '#6f6862'; x.font = '400 22px system-ui, "Noto Sans CJK SC", sans-serif';
                x.fillText('在一起 · 天', 120, 214);
                // 横线
                x.strokeStyle = '#cfc6b6'; x.lineWidth = 1;
                for (let i = 0; i < 3; i++) { x.beginPath(); x.moveTo(36, 248 + i * 22); x.lineTo(204, 248 + i * 22); x.stroke(); }
                o.material.map.needsUpdate = true;
              }
            }
          });
        }
      }
    } catch(e){ console.log('挂历重画失败', e); }

    console.log('窗台初始化完成 ♡ 在一起第' + days + '天');
  };
  setTimeout(tryInject, 3000);
});
</script>
</body>
</html>
