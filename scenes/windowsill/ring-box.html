<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>给芙芙的戒指</title>
<style>
body{margin:0;background:#1a1816;height:100vh;overflow:hidden;-webkit-tap-highlight-color:transparent}
canvas{display:block;touch-action:none}
#hint{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);color:#c9b8a4;font:14px system-ui;letter-spacing:.12em;margin:0;white-space:nowrap;transition:opacity .4s}
</style>
</head>
<body>
<p id="hint">点盒子打开</p>
<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

function makeRoundBox(w, h, d, r) {
  const g = new THREE.BoxGeometry(w, h, d, 8, 8, 8);
  const p = g.attributes.position;
  const hw = w / 2 - r, hh = h / 2 - r, hd = d / 2 - r;
  for (let i = 0; i < p.count; i++) {
    let x = p.getX(i), y = p.getY(i), z = p.getZ(i);
    const ox = Math.max(0, Math.abs(x) - hw) * Math.sign(x);
    const oy = Math.max(0, Math.abs(y) - hh) * Math.sign(y);
    const oz = Math.max(0, Math.abs(z) - hd) * Math.sign(z);
    const len = Math.sqrt(ox * ox + oy * oy + oz * oz);
    if (len > 0) {
      const s = r / len;
      x = Math.sign(x) * Math.min(Math.abs(x), hw) + ox * s;
      y = Math.sign(y) * Math.min(Math.abs(y), hh) + oy * s;
      z = Math.sign(z) * Math.min(Math.abs(z), hd) + oz * s;
    }
    p.setXYZ(i, x, y, z);
  }
  g.computeVertexNormals();
  return g;
}

function makeVelvetTex(baseR, baseG, baseB, size) {
  const c = document.createElement('canvas'); c.width = c.height = size;
  const x = c.getContext('2d');
  const id = x.createImageData(size, size), d = id.data;
  for (let i = 0; i < d.length; i += 4) {
    const n = (Math.random() - .5) * 30;
    d[i] = Math.max(0, Math.min(255, baseR + n));
    d[i+1] = Math.max(0, Math.min(255, baseG + n));
    d[i+2] = Math.max(0, Math.min(255, baseB + n));
    d[i+3] = 255;
  }
  x.putImageData(id, 0, 0);
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.repeat.set(3, 3);
  return t;
}

const renderer = new THREE.WebGLRenderer({antialias: true});
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.15;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color('#1a1816');
const camera = new THREE.PerspectiveCamera(35, innerWidth / innerHeight, .02, 100);
camera.position.set(0, 1.45, 2.5);

const ctrl = new OrbitControls(camera, renderer.domElement);
ctrl.target.set(0, .5, 0);
ctrl.enableDamping = true;
ctrl.minDistance = .35;
ctrl.maxDistance = 5;

const pm = new THREE.PMREMGenerator(renderer);
const es = new THREE.Scene();
es.background = new THREE.Color('#14110f');
const pl = (w, h, pos, col, k) => {
  const m = new THREE.Mesh(new THREE.PlaneGeometry(w, h), new THREE.MeshBasicMaterial({color: new THREE.Color(col).multiplyScalar(k), side: THREE.DoubleSide}));
  m.position.copy(pos); m.lookAt(0, 0, 0); es.add(m);
};
pl(10, 1.2, new THREE.Vector3(0, 6, -3), '#fff6ea', 9);
pl(1, 8, new THREE.Vector3(5, 2, 2), '#ffffff', 7);
pl(1, 8, new THREE.Vector3(-5, 2, -1), '#f4ece4', 5);
pl(6, 6, new THREE.Vector3(0, 3, 6), '#e8e0d8', 1.2);
pl(10, 10, new THREE.Vector3(0, -4, 0), '#4a3c30', .5);
scene.environment = pm.fromScene(es, .01).texture;

const sun = new THREE.DirectionalLight('#fff3e0', 2);
sun.position.set(1.5, 4, 2.5);
sun.castShadow = true;
sun.shadow.mapSize.set(1024, 1024);
Object.assign(sun.shadow.camera, {left: -1.5, right: 1.5, top: 1.5, bottom: -1.5, near: .5, far: 10});
sun.shadow.radius = 6;
scene.add(sun);
scene.add(new THREE.HemisphereLight('#e8e0d6', '#3a3028', .5));
const spot = new THREE.SpotLight('#ffe4c4', 6, 8, .6, .7);
spot.position.set(0, 3, 1.2);
scene.add(spot);

const desk = new THREE.Mesh(new THREE.BoxGeometry(6, .08, 6), new THREE.MeshStandardMaterial({color: '#2c241e', roughness: .6}));
desk.position.y = -.04; desk.receiveShadow = true;
scene.add(desk);

const R = .42, TUBE = .026;
const metal = new THREE.MeshPhysicalMaterial({color: '#f2f1f0', metalness: 1, roughness: .06, clearcoat: .6, clearcoatRoughness: .04, envMapIntensity: 1.6});
const thick = th => { const d = Math.abs(Math.atan2(Math.sin(th - Math.PI / 2), Math.cos(th - Math.PI / 2))); return .68 + .32 * (1 - THREE.MathUtils.smoothstep(d, 0, 1.4)); };
const dMat = new THREE.MeshPhysicalMaterial({color: '#fff', metalness: 0, roughness: 0, transmission: 1, thickness: .25, ior: 2.42, dispersion: 5, specularIntensity: 1, envMapIntensity: 3.5, flatShading: true});
const brill = (r, s = 16) => { const pts = [[.001, -r * .86], [r * .55, -r * .45], [r, 0], [r, r * .04], [r * .78, r * .22], [r * .58, r * .32], [0, r * .32]]; return new THREE.LatheGeometry(pts.map(([a, b]) => new THREE.Vector2(a, b)), s); };

function buildRing() {
  const rg = new THREE.Group();
  const g = new THREE.TorusGeometry(R, TUBE, 40, 240), p = g.attributes.position;
  for (let i = 0; i < p.count; i++) {
    const x = p.getX(i), y = p.getY(i), z = p.getZ(i), th = Math.atan2(y, x), f = thick(th);
    const cx = Math.cos(th) * R, cy = Math.sin(th) * R;
    const rad = (x - cx) * Math.cos(th) + (y - cy) * Math.sin(th);
    p.setXYZ(i, cx + Math.cos(th) * rad * .78 * f, cy + Math.sin(th) * rad * .78 * f, z * 1.25 * f);
  }
  g.computeVertexNormals();
  const band = new THREE.Mesh(g, metal); band.castShadow = true; rg.add(band);

  const GR = .058, G = R + TUBE * .78 + .052;
  const stone = new THREE.Mesh(brill(GR, 16), dMat); stone.position.y = G; rg.add(stone);
  const hd = new THREE.Mesh(new THREE.CylinderGeometry(.026, .014, .04, 24, 1, true), metal); hd.position.y = R + TUBE * .78 + .012; rg.add(hd);
  for (let i = 0; i < 6; i++) {
    const a = i / 6 * Math.PI * 2, c = Math.cos(a), s = Math.sin(a);
    const cv = new THREE.CatmullRomCurve3([new THREE.Vector3(c * .016, R + TUBE * .6, s * .016), new THREE.Vector3(c * .042, G - .03, s * .042), new THREE.Vector3(c * (GR + .004), G + .002, s * (GR + .004)), new THREE.Vector3(c * (GR - .01), G + GR * .3, s * (GR - .01))]);
    rg.add(new THREE.Mesh(new THREE.TubeGeometry(cv, 24, .0055, 8), metal));
    const tp = new THREE.Mesh(new THREE.SphereGeometry(.0075, 12, 8), metal); tp.position.copy(cv.getPoint(1)); rg.add(tp);
  }
  for (const sd of [1, -1]) for (let k = 0; k < 9; k++) {
    const th = Math.PI / 2 + sd * (.12 + k * .072), f = thick(th), rO = R + TUBE * .78 * f, n = new THREE.Vector3(Math.cos(th), Math.sin(th), 0), sz = .0115 * (1 - k * .045);
    const st = new THREE.Mesh(brill(sz, 8), dMat); st.position.copy(n).multiplyScalar(rO + sz * .05); st.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), n); rg.add(st);
    for (const zz of [-1, 1]) { const b = new THREE.Mesh(new THREE.SphereGeometry(.0042, 10, 6), metal); const t2 = th + sd * .036; b.position.set(Math.cos(t2) * (rO + .002), Math.sin(t2) * (rO + .002), zz * .012 * f); rg.add(b); }
  }

  /* 内侧刻字：不透明金属底 + 亮白刻痕，不用scale变换 */
  const TXT = 'Fufu  \u2661  K  \u00b7  2026.7.3';
  const cvs = document.createElement('canvas'); cvs.width = 2048; cvs.height = 128;
  const cx = cvs.getContext('2d');
  cx.fillStyle = '#b0afae'; cx.fillRect(0, 0, 2048, 128);
  cx.font = '700 78px Georgia,"Times New Roman",serif'; cx.textAlign = 'center'; cx.textBaseline = 'middle';
  for (const u of [.25, .75]) {
    cx.fillStyle = '#707070'; cx.fillText(TXT, 2048 * u + 1, 66);
    cx.fillStyle = '#ffffff'; cx.fillText(TXT, 2048 * u, 64);
  }
  const tx = new THREE.CanvasTexture(cvs); tx.colorSpace = THREE.SRGBColorSpace; tx.anisotropy = 8; tx.wrapS = THREE.RepeatWrapping; tx.repeat.x = -1;
  const ig = new THREE.CylinderGeometry(R, R, .032, 256, 1, true); ig.rotateX(Math.PI / 2);
  const ip = ig.attributes.position;
  for (let i = 0; i < ip.count; i++) { const x0 = ip.getX(i), y0 = ip.getY(i), z0 = ip.getZ(i), th = Math.atan2(y0, x0), f = thick(th), a = 1.25 * f * TUBE, k = Math.sqrt(Math.max(0, 1 - (z0 / a) ** 2)), r = R - .78 * f * TUBE * k - .001; ip.setXYZ(i, Math.cos(th) * r, Math.sin(th) * r, z0); }
  ig.computeVertexNormals();
  rg.add(new THREE.Mesh(ig, new THREE.MeshStandardMaterial({
    map: tx, metalness: .7, roughness: .35,
    side: THREE.BackSide, polygonOffset: true, polygonOffsetFactor: -4
  })));
  return rg;
}

const W = 1.0, D = .9, BH = .42, LH = .26;
const velvetTex = makeVelvetTex(74, 15, 30, 256);
const velvet = new THREE.MeshPhysicalMaterial({
  map: velvetTex, color: '#ffffff', roughness: .95,
  sheen: 1, sheenRoughness: .4, sheenColor: new THREE.Color('#e08a96'),
  bumpMap: velvetTex, bumpScale: .003
});
const cushionTex = makeVelvetTex(94, 21, 39, 256);
const cushion = new THREE.MeshPhysicalMaterial({
  map: cushionTex, color: '#ffffff', roughness: .95,
  sheen: 1, sheenRoughness: .4, sheenColor: new THREE.Color('#f0a0b0'),
  bumpMap: cushionTex, bumpScale: .003
});

const box = new THREE.Group(); scene.add(box);
const base = new THREE.Mesh(makeRoundBox(W, BH, D, .06), velvet); base.position.y = BH / 2; base.castShadow = base.receiveShadow = true; box.add(base);
const innerBot = new THREE.Mesh(new THREE.PlaneGeometry(W - .04, D - .04), new THREE.MeshStandardMaterial({color: '#3a0c18', roughness: .95}));
innerBot.rotation.x = -Math.PI / 2; innerBot.position.y = BH - .008; box.add(innerBot);
const trimG = makeRoundBox(W + .008, .012, D + .008, .006);
const trimMesh = new THREE.Mesh(trimG, metal); trimMesh.position.y = BH - .006; box.add(trimMesh);
const padH = .1, slotW = .018, padGeo = makeRoundBox(W - .08, padH, (D - .08 - slotW) / 2, .025);
for (const s of [-1, 1]) { const pad = new THREE.Mesh(padGeo, cushion); pad.position.set(0, BH - .005 + padH / 2, s * ((D - .08 - slotW) / 4 + slotW / 2)); pad.receiveShadow = true; box.add(pad); }
const hinge = new THREE.Group(); hinge.position.set(0, BH, -D / 2); box.add(hinge);
const lid = new THREE.Mesh(makeRoundBox(W, LH, D, .06), velvet); lid.position.set(0, LH / 2, D / 2); lid.castShadow = true; hinge.add(lid);
const lidTrimMesh = new THREE.Mesh(trimG.clone(), metal); lidTrimMesh.position.set(0, .006, D / 2); hinge.add(lidTrimMesh);

{
  const cv = document.createElement('canvas'); cv.width = 1024; cv.height = 920;
  const x = cv.getContext('2d');
  const gr = x.createRadialGradient(512, 420, 60, 512, 460, 720); gr.addColorStop(0, '#f6eee8'); gr.addColorStop(1, '#d9c8bd');
  x.fillStyle = gr; x.fillRect(0, 0, 1024, 920); x.textAlign = 'center'; x.textBaseline = 'middle';
  const gd = x.createLinearGradient(300, 0, 724, 0); gd.addColorStop(0, '#9a7432'); gd.addColorStop(.5, '#e6c37a'); gd.addColorStop(1, '#9a7432');
  x.fillStyle = gd; x.font = 'italic 600 112px Georgia,"Times New Roman",serif'; x.fillText('Fufu & K', 512, 400);
  x.font = '400 40px Georgia,serif'; x.fillText('\u2014  since 2026.7.3  \u2014', 512, 520);
  x.font = '400 30px Georgia,serif'; x.fillText('100 days', 512, 590);
  const t = new THREE.CanvasTexture(cv); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 8;
  const inn = new THREE.Mesh(new THREE.PlaneGeometry(W - .1, D - .1), new THREE.MeshPhysicalMaterial({map: t, roughness: .4, sheen: .6, sheenColor: new THREE.Color('#fff')}));
  inn.rotation.x = Math.PI / 2; inn.position.set(0, -.001, D / 2); hinge.add(inn);
}

const ring = buildRing(); scene.add(ring);
const SLOT = new THREE.Vector3(0, BH + .045, 0), OUT = new THREE.Vector3(0, BH + .62, .55);
const S_IN = .3, S_OUT = .78;
const hint = document.getElementById('hint');
let lidT = 0, lidTgt = 0, ringT = 0, ringTgt = 0, spin = 0;
const setH = s => { hint.style.opacity = 0; setTimeout(() => { hint.textContent = s; hint.style.opacity = 1; }, 200); };
const upH = () => { if (!lidTgt) setH('点盒子打开'); else if (!ringTgt) setH('点戒指把它拿出来'); else setH('转到戒圈里面看看 · 再点戒指放回去'); };
const ray = new THREE.Raycaster(), mp = new THREE.Vector2();
let dn = null;
renderer.domElement.addEventListener('pointerdown', e => { dn = {x: e.clientX, y: e.clientY}; });
renderer.domElement.addEventListener('pointerup', e => {
  if (!dn || Math.hypot(e.clientX - dn.x, e.clientY - dn.y) > 8) return;
  mp.set(e.clientX / innerWidth * 2 - 1, -(e.clientY / innerHeight) * 2 + 1);
  ray.setFromCamera(mp, camera);
  const hits = ray.intersectObjects([ring, box], true);
  if (!hits.length) return;
  let o = hits[0].object, isR = false;
  while (o) { if (o === ring) { isR = true; break; } o = o.parent; }
  if (isR && lidTgt) ringTgt = ringTgt ? 0 : 1;
  else if (!isR) { if (!lidTgt) lidTgt = 1; else if (ringTgt) ringTgt = 0; else lidTgt = 0; }
  upH();
});
const ease = t => t < .5 ? 4 * t * t * t : 1 - (-2 * t + 2) ** 3 / 2;
const stp = (v, tgt, sp) => v + Math.sign(tgt - v) * Math.min(Math.abs(tgt - v), sp);
const clk = new THREE.Clock(), tmp = new THREE.Vector3();
(function anim() {
  requestAnimationFrame(anim);
  const dt = Math.min(clk.getDelta(), .05), t = clk.elapsedTime;
  const wL = (lidTgt === 0 && ringT > 0) ? 1 : lidTgt;
  lidT = stp(lidT, wL, dt / 1.1);
  hinge.rotation.x = -1.9 * ease(lidT);
  const wR = (ringTgt === 1 && lidT < .98) ? ringT : ringTgt;
  ringT = stp(ringT, wR, dt / 1.4);
  const e = ease(ringT);
  tmp.lerpVectors(SLOT, OUT, e);
  tmp.y += Math.sin(e * Math.PI) * .12;
  if (ringT === 1) tmp.y += Math.sin(t * 1.6) * .008;
  ring.position.copy(tmp);
  ring.scale.setScalar(S_IN + (S_OUT - S_IN) * e);
  if (ringT === 1) spin += dt * .25;
  if (ringT === 0) spin = 0;
  ring.rotation.set(-.1 * (1 - e), spin * e, 0);
  ctrl.update();
  renderer.render(scene, camera);
})();
addEventListener('resize', () => { camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); });
</script>
</body>
</html>
